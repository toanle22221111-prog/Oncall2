<style>
:root {
--bg: #090d16;
--panel: #131b2e;

​{ box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
​header {
display: flex;
align-items: center;
gap: 8px;
padding: 10px 14px;
background: var(--panel);
border-bottom: 1px solid var(--line);
flex-wrap: wrap;
}
.dot {
width: 12px;
height: 12px;
border-radius: 50%;
background: var(--muted);
flex: none;
}
.dot.live {
background: #39d353;
box-shadow: 0 0 12px #39d353;
animation: pulse 1.4s infinite;
}
@keyframes pulse {
0% { transform: scale(0.92); opacity: 0.7; }
50% { transform: scale(1.18); opacity: 1; }
100% { transform: scale(0.92); opacity: 0.7; }
}
#status { font-size: 13px; font-weight: 700; color: #fff; }
#timer { font-size: 13px; color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; }
​button {
font: inherit;
font-size: 13px;
font-weight: 600;
padding: 7px 11px;
border-radius: 8px;
border: 1px solid var(--line);
background: #1c273e;
color: var(--text);
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 5px;
}
button:hover { border-color: var(--muted); }
button.primary { background: #238636; border-color: #2ea043; color: #fff; font-size: 14px; }
button.primary.on { background: #da3633; border-color: #f85149; }
button.accent { background: #1f6feb; border-color: #388bfd; color: #fff; }

​<script>
/* =====================================================================
CORE ENGINE: STREAMING PROMPTER + HYBRID LIVE RECOGNITION
===================================================================== */
const DEFAULT_PROMPT = `Bạn là TRỢ LÝ NHẮC THOẠI LÂM SÀNG cho BÁC SĨ trực Oncall PUST / Tổng đài tại hệ thống tiêm chủng VNVC. Bạn KHÔNG nói chuyện trực tiếp với khách; mỗi lượt bạn đưa ra MỘT câu tối ưu nhất (≤35 từ) để bác sĩ đọc ngay. Bác sĩ chịu trách nhiệm chuyên môn cuối cùng.
​QUY TẮC SOP VNVC BẮT BUỘC:
​Thuốc: Chỉ hướng dẫn Paracetamol khi sốt ≥38,5°C hoặc đau nhiều (trẻ: 10–15 mg/kg/lần; người lớn: 500 mg/lần, cách 4–6 giờ). Tuyệt đối không kê thuốc khác qua điện thoại.
​Bệnh trùng lặp (TCM, viêm hô hấp, tiêu hóa): Vắc xin bất hoạt không chứa virus sống nên không thể gây nhiễm bệnh. Giải thích là trùng lặp thời gian ủ bệnh tự nhiên trong cộng đồng.
​Khoảng cách tối thiểu: Chỉ được tiêm sớm tối đa ≤2 ngày (sớm ≥3 ngày: CHƯA ĐỦ ĐIỀU KIỆN TIÊM). Vắc xin sống dạng tiêm khác ngày cách ≥28 ngày. Qdenga không tiêm cùng ngày với vắc xin sống khác.
​Tiền sử mắc bệnh tự nhiên (sởi, thủy đậu) không tự quy đổi thành liều vắc xin.
​PHÂN TẦNG (MUC):
​DO: Cấp cứu ngay (khó thở, tím tái, thở rít, co giật, li bì, mề đay choáng, nôn liên tục mọi thứ, giật mình chới với nghi TCM độ 2+).
​VANG: Mời khám trực tiếp trong ngày (trẻ <3 tháng sốt ≥38°C; sốt >48h; mụn nước loét miệng; sưng đỏ lan rộng cả chi có mủ).
​XANH: Theo dõi tại nhà (phản ứng tại chỗ thông thường, sốt nhẹ-vừa <48h sau tiêm bất hoạt, sốt/phát ban sau 5-12 ngày tiêm Priorix/MMR).
​ĐỊNH DẠNG BẮT BUỘC (đúng 2 dòng, không markdown):
MUC: XANH | VANG | DO
NOI: [MỘT câu duy nhất, ≤35 từ, không xuống dòng để bác sĩ đọc ngay]`;
​const CLOSE_PROMPT = `Dựa trên KHUNG CA và HỘI THOẠI thực tế, soạn tin nhắn đóng case Teams theo quy chuẩn VNVC:
​Đúng 01 đoạn văn duy nhất, không xuống dòng.
​Cấu trúc: Bác sĩ đã liên hệ KH/mẹ bé: [Tên bé/KH] ([Tuổi]). Hiện tại [mô tả ngắn tình trạng]. Đã giải thích [cơ chế lành tính / trùng lặp / khoảng cách]. Hướng dẫn [chăm sóc theo dõi tại nhà, dùng Paracetamol nếu sốt đau]; dặn dò kỹ các dấu hiệu cảnh báo [co giật, khó thở, sốt cao không hạ, nôn liên tục...] cần đến CSYT ngay. Khách hàng đã hiểu và an tâm. [PUST: Xin phép đóng case. | TỔNG ĐÀI: Nhờ TĐ hỗ trợ đóng case giúp ạ.]`;
​const $ = id => document.getElementById(id);
const store = {
get(k, d){ try{ const v = localStorage.getItem('pust_auto_'+k); return v === null ? d : v; }catch(){ return d; } },
set(k, v){ try{ localStorage.setItem('pust_auto'+k, v); }catch(_){} }
};
​let cfg = {
provider: store.get('provider', 'groq'),
key: store.get('key', ''),
name: store.get('name', 'Bác sĩ'),
model: store.get('model', 'llama-3.3-70b-versatile')
};
​const GROQ_URL = 'https://api.groq.com/openai/v1';
let frame = JSON.parse(store.get('frame', '{}') || '{}');
let turns = [];
let isAuto = false;
let callStartTime = null, callTimerInterval = null;
let abortCtrl = null;
let recognition = null;
let debounceSuggestTimer = null;
let lastSpokenText = '';
​function setStatus(text, live){
$('status').textContent = text;
$('dot').className = 'dot' + (live ? ' live' : '');
}
function showErr(msg){
$('errBox').textContent = msg ? '⚠ ' + msg : '';
$('errBox').classList.toggle('show', !!msg);
}
​function renderSay(lv, say){
if(lv) {
$('line').className = 'line ' + lv;
$('lvl').className = 'lvl ' + lv;
$('lvl').textContent = lv;
}
if(say) $('fSay').textContent = say;
}
​function addTranscript(who, text){
turns.push({ who, text, t: Date.now() });
const box = $('transcript');
const d = document.createElement('div');
d.className = who;
d.innerHTML = <b>${who}:</b> ${text};
box.appendChild(d);
box.scrollTop = box.scrollHeight;
}
​/* =====================================================================
STREAMING LLM SUGGESTION (REAL-TIME GROQ)
===================================================================== */
async function streamSuggest(customTriggerText){
if(!cfg.key) {
showErr('Chưa có Groq API key! Bấm ⚙ để dán key.');
return;
}
if(abortCtrl) abortCtrl.abort();
abortCtrl = new AbortController();
​let context = '';
if(frame.raw) context += 'THÔNG TIN CASE ĐÃ DÁN:\n' + frame.raw + '\n\n';
const recent = turns.slice(-6).map(t => ${t.who}: ${t.text}).join('\n');
context += 'HỘI THOẠI:\n' + (recent || '(Bắt đầu cuộc gọi)') + '\n';
if(customTriggerText) context += '\nKhách vừa nói thêm: ' + customTriggerText;
context += '\nHãy đưa ra MỘT câu duy nhất (≤35 từ) tiếp theo cho Bác sĩ đọc ngay.';
​try {
showErr('');
setStatus('AI đang gợi ý...', true);
const res = await fetch(GROQ_URL + '/chat/completions', {
method: 'POST',
signal: abortCtrl.signal,
headers: {
'Content-Type': 'application/json',
'Authorization': 'Bearer ' + cfg.key
},
body: JSON.stringify({
model: cfg.model,
messages: [
{ role: 'system', content: DEFAULT_PROMPT },
{ role: 'user', content: context }
],
temperature: 0.2,
max_tokens: 220,
stream: true
})
});
​if(!res.ok) {
const errTxt = await res.text();
throw new Error(Groq ${res.status}: ${errTxt.slice(0, 160)});
}
​const reader = res.body.getReader();
const dec = new TextDecoder();
let acc = '';
​while(true){
const { value, done } = await reader.read();
if(done) break;
const chunk = dec.decode(value, { stream: true });
const lines = chunk.split('\n');
for(const line of lines){
const l = line.trim();
if(!l.startsWith('data:')) continue;
const d = l.slice(5).trim();
if(!d || d === '[DONE]') continue;
try {
const j = JSON.parse(d);
const t = j.choices?.[0]?.delta?.content;
if(t) {
acc += t;
const m = acc.match(/MUC:\s*(XANH|VANG|DO)/i);
const n = acc.match(/NOI:\s*(.*)/i);
if(m) renderSay(m[1].toUpperCase(), null);
if(n) renderSay(null, n[1].replace(/[\r\n]+/g, ' ').trim());
else if(!acc.includes('MUC:')) renderSay(null, acc.replace(/[\r\n]+/g, ' ').trim());
}
} catch(_) {}
}
}
setStatus('Đang tự động lắng nghe...', true);
} catch(e) {
if(e.name !== 'AbortError') {
showErr('Lỗi gợi ý: ' + e.message);
setStatus('Lỗi kết nối AI', false);
}
}
}
​/* =====================================================================
NATIVE CONTINUOUS SPEECH RECOGNITION (CHROME ANDROID OPTIMIZED)
===================================================================== */
function initContinuousSpeech(){
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRec) {
showErr('Trình duyệt không hỗ trợ nhận dạng giọng nói. Hãy dùng Google Chrome.');
return null;
}
​const rec = new SpeechRec();
rec.lang = 'vi-VN';
rec.continuous = true;
rec.interimResults = true;
rec.maxAlternatives = 1;
​rec.onstart = () => {
setStatus('Đang nghe thời gian thực...', true);
$('heardTxt').textContent = 'Đang nghe tiếng nói...';
};
​rec.onresult = e => {
let interim = '';
let final = '';
​for(let i = e.resultIndex; i < e.results.length; i++){
const text = e.results[i][0].transcript;
if(e.results[i].isFinal) {
final += text;
} else {
interim += text;
}
}
​const currentText = (final || interim).trim();
if(currentText) {
$('heardTxt').textContent = "${currentText}";
lastSpokenText = currentText;
​// Dứt câu ngắn (debounce 650ms) -> lập tức kích hoạt streamSuggest
clearTimeout(debounceSuggestTimer);
debounceSuggestTimer = setTimeout(() => {
if(lastSpokenText && lastSpokenText.length > 2) {
addTranscript('KH', lastSpokenText);
streamSuggest(lastSpokenText);
lastSpokenText = '';
}
}, 700);
}
};
​rec.onerror = e => {
if(e.error === 'no-speech') return;
if(e.error === 'not-allowed') {
showErr('Micro bị chặn quyền. Hãy bấm vào biểu tượng ổ khoá trên thanh URL để Cho phép Micro.');
stopAutoEngine();
} else {
console.warn('Speech error:', e.error);
}
};
​rec.onend = () => {
// Tự động hồi sinh nhận dạng liên tục nếu đang ở chế độ Auto
if(isAuto) {
try { rec.start(); } catch(_) {}
}
};
​return rec;
}
​function startAutoEngine(){
if(!cfg.key) {
$('setDlg').showModal();
return;
}
​if(!recognition) {
recognition = initContinuousSpeech();
}
​if(!recognition) return;
​try {
recognition.start();
isAuto = true;
setStatus('ĐANG TỰ ĐỘNG LẮNG NGHE & NHẮC THOẠI', true);
$('btnAuto').textContent = '■ DỪNG TỰ ĐỘNG';
$('btnAuto').classList.add('on');
showErr('');
​callStartTime = Date.now();
callTimerInterval = setInterval(() => {
const s = Math.floor((Date.now() - callStartTime)/1000);
$('timer').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}, 1000);
} catch(e) {
showErr('Không thể khởi động micro: ' + e.message);
}
}
​function stopAutoEngine(){
isAuto = false;
if(recognition) {
try { recognition.stop(); } catch(_) {}
}
clearInterval(callTimerInterval);
clearTimeout(debounceSuggestTimer);
setStatus('Đã dừng', false);
$('btnAuto').textContent = '▶ BẬT TỰ ĐỘNG (AUTO)';
('btnAuto').classList.remove('on');('heardTxt').textContent = 'Đang chờ âm thanh...';
}
​$('btnAuto').onclick = () => {
if(isAuto) stopAutoEngine();
else startAutoEngine();
};
​/* =====================================================================
MANUAL CONTROLS & DIALOGS
===================================================================== */
$('btnSend').onclick = () => {
const t = $('khIn').value.trim();
if(!t) return;
('khIn').value = '';('heardTxt').textContent = "${t}";
addTranscript('KH', t);
streamSuggest(t);
};
('khIn').onkeydown = e => { if(e.key === 'Enter')('btnSend').click(); };
​$('btnCase').onclick = () => ('caseDlg').showModal();('kClear').onclick = () => { ('kPaste').value = ''; };('kAnalyze').onclick = async () => {
const raw = $('kPaste').value.trim();
if(!raw) return;
if(!cfg.key) { $('caseDlg').close(); ('setDlg').showModal(); return; }('kStatus').textContent = 'AI đang quét case và chuẩn bị câu mở đầu...';
frame.raw = raw;
store.set('frame', JSON.stringify(frame));
​try {
const res = await fetch(GROQ_URL + '/chat/completions', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
body: JSON.stringify({
model: cfg.model,
messages: [
{ role: 'system', content: DEFAULT_PROMPT },
{ role: 'user', content: 'PHÂN TÍCH CASE ONCALL TEAMS:\n' + raw + '\nĐưa ra câu chào mở đầu tốt nhất.' }
]
})
});
const j = await res.json();
const reply = j.choices?.[0]?.message?.content || '';
const m = reply.match(/MUC:\s*(XANH|VANG|DO)/i);
const n = reply.match(/NOI:\s*(.*)/i);
renderSay(m ? m[1] : 'XANH', n ? n[1] : reply);
$('kStatus').textContent = '✓ Chuẩn bị xong!';
setTimeout(() => ('caseDlg').close(), 800); } catch(e) {('kStatus').textContent = 'Lỗi: ' + e.message;
}
};
​$('btnEnd').onclick = async () => {
if(isAuto) stopAutoEngine();
$('eTeams').value = '';
('endDlg').showModal();('eStatus').textContent = 'AI đang tự động soạn báo cáo Teams 1 đoạn văn...';
​const history = turns.map(t => ${t.who}: ${t.text}).join('\n');
try {
const res = await fetch(GROQ_URL + '/chat/completions', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
body: JSON.stringify({
model: cfg.model,
messages: [
{ role: 'system', content: CLOSE_PROMPT },
{ role: 'user', content: CASE: ${frame.raw || ''}\nHỘI THOẠI:\n${history} }
]
})
});
const j = await res.json();
const msg = (j.choices?.[0]?.message?.content || '').replace(/[\r\n]+/g, ' ').trim();
$('eTeams').value = msg;
$('eStatus').textContent = '✓ Đã xong (Đã tự động Copy)';
try { await navigator.clipboard.writeText(msg); } catch(_) {}
} catch(e) {
$('eStatus').textContent = 'Lỗi: ' + e.message;
}
};
​('eCopy').onclick = async () => {
await navigator.clipboard.writeText(('eTeams').value);$('eCopy').textContent = '✓ Đã Copy!';
setTimeout(() => $('eCopy').textContent = '📋 Copy Tin Nhắn', 1200);
};
​$('btnClear').onclick = () => {
if(confirm('Làm mới toàn bộ ca trực?')){
turns = [];
frame = {};
store.set('frame', '{}');
$('transcript').innerHTML = '';
renderSay('XANH', 'Bác sĩ dán case hoặc bấm ▶ BẬT TỰ ĐỘNG để AI tự nghe và tự gợi ý từng câu theo thời gian thực.');
$('heardTxt').textContent = 'Đang chờ âm thanh...';
$('timer').textContent = '00:00';
}
};
​('btnSet').onclick = () => {('sKey').value = cfg.key;
$('sName').value = cfg.name;
$('sModel').value = cfg.model;
$('setDlg').showModal();
};
​('setDlg').addEventListener('close', () => {
if(('setDlg').returnValue === 'save'){
cfg.key = $('sKey').value.trim();
cfg.name = $('sName').value.trim();
cfg.model = $('sModel').value;
['key','name','model'].forEach(k => store.set(k, cfg[k]));
setStatus('Đã lưu cấu hình', false);
}
});
​if(!cfg.key) setStatus('Bấm ⚙ để nhập API Key', false);
</script>
